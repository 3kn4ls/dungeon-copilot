name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install pnpm (version from packageManager)
        run: npm install -g "$(node -p "require('./package.json').packageManager")"
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Los tests de la API usan PGlite; aquí se repiten contra un PostgreSQL de verdad.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install pnpm (version from packageManager)
        run: npm install -g "$(node -p "require('./package.json').packageManager")"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dungeon-copilot/server test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  # La imagen de Docker y los manifiestos de deploy/k3s.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the k3s manifests
        run: |
          kubectl kustomize deploy/k3s > "$RUNNER_TEMP/k3s.yaml"
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" kubeconform
          "$RUNNER_TEMP/kubeconform" -strict -summary "$RUNNER_TEMP/k3s.yaml"
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: dungeon-copilot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: deploy/smoke-test.sh dungeon-copilot:ci

  # Con todo en verde, cada cambio de main se publica en ghcr.io para amd64 y arm64.
  publish:
    if: github.event_name == 'push'
    needs: [check, postgres, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # En orden: latest siempre es el último commit de main.
    concurrency:
      group: publish-${{ github.ref }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
